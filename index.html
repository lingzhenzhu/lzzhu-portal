<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Glass Switch</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .demo-container {
      position: relative;
      height: 400px;
      display: flex;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      user-select: none;
      overflow: hidden;
    }

    /* 背景图片 - 折射效果必须有背景才能看到 */
    .demo-background {
      position: absolute;
      inset: 0;
      background: url('https://images.unsplash.com/photo-1579380656108-f98e4df8ea62?w=800') center/cover;
    }

    .switch-track {
      position: relative;
      z-index: 10;
      display: inline-block;
      width: 160px;
      height: 67px;
      border-radius: 33.5px;
      cursor: pointer;
      background-color: rgba(59, 191, 78, 0.93);
      transition: background-color 0.3s ease;
    }

    .switch-track.off {
      background-color: rgba(120, 120, 128, 0.32);
    }

    .switch-thumb {
      position: absolute;
      height: 92px;
      width: 146px;
      margin-left: -21.95px;
      border-radius: 46px;
      top: 33.5px;
      backdrop-filter: url(#liquid-glass-switch-filter);
      -webkit-backdrop-filter: url(#liquid-glass-switch-filter);
      background-color: rgba(255, 255, 255, 1);
      box-shadow: 0 4px 22px rgba(0, 0, 0, 0.1);
      transform: translateX(57.9px) translateY(-50%) scale(0.65);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .switch-track.off .switch-thumb {
      transform: translateX(0px) translateY(-50%) scale(0.65);
    }

    .svg-filters {
      display: none;
    }
  </style>
</head>
<body>

<svg class="svg-filters" color-interpolation-filters="sRGB">
  <defs>
    <filter id="liquid-glass-switch-filter">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.2" result="blurred_source" />
      
      <feImage 
        href="/assets/displacement-map-z1p3yi.png" 
        x="0" y="0" 
        width="146" height="92" 
        result="displacement_map" 
      />
      
      <feDisplacementMap 
        in="blurred_source" 
        in2="displacement_map" 
        scale="22.26" 
        xChannelSelector="R" 
        yChannelSelector="G" 
        result="displaced" 
      />
      
      <feColorMatrix 
        in="displaced" 
        type="saturate" 
        values="6" 
        result="displaced_saturated" 
      />
      
      <feImage 
        href="/assets/specular-map-z1p3yi.png" 
        x="0" y="0" 
        width="146" height="92" 
        result="specular_layer" 
      />
      
      <feComposite 
        in="displaced_saturated" 
        in2="specular_layer" 
        operator="in" 
        result="specular_saturated" 
      />
      
      <feComponentTransfer in="specular_layer" result="specular_faded">
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      
      <feBlend in="specular_saturated" in2="displaced" mode="normal" result="withSaturation" />
      <feBlend in="specular_faded" in2="withSaturation" mode="normal" />
    </filter>
  </defs>
</svg>

<div class="demo-container">
  <!-- 背景层 - 这是被折射的内容 -->
  <div class="demo-background"></div>
  
  <!-- Switch -->
  <div class="switch-track" onclick="this.classList.toggle('off')">
    <div class="switch-thumb"></div>
  </div>
</div>

</body>
</html>

## 关键理解

**Liquid Glass 折射原理：**
```
背景内容 → backdrop-filter 捕获 → SVG 位移贴图扭曲 → 产生折射效果
